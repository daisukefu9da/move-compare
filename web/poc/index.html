<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ダンス比較 PoC</title>
<style>
  :root { --fg: #1f2328; --sub: #6a737d; --bg: #fff; --card: #f6f8fa; --line: #d0d7de; --accent: #e5484d; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e6edf3; --sub: #9aa4af; --bg: #0d1117; --card: #161b22; --line: #30363d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 15px; line-height: 1.5; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  .sub { color: var(--sub); font-size: 13px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin: 12px 0; }
  button, select, input[type=file] { font: inherit; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  button:disabled { opacity: .45; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
  label { display: inline-flex; gap: 6px; align-items: center; }
  progress { width: 100%; height: 10px; }
  canvas, video { max-width: 100%; border-radius: 8px; background: #000; display: block; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  td { border-bottom: 1px solid var(--line); padding: 4px 6px; }
  td:first-child { color: var(--sub); width: 55%; }
  .scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .score { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; text-align: center; }
  .score b { display: block; font-size: 22px; }
  .err { color: var(--accent); white-space: pre-wrap; }
  .hidden { display: none; }
  pre { white-space: pre-wrap; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>ダンス比較 PoC（ブラウザの中で骨格推定）</h1>
  <div class="sub">動画は端末の外に送りません。骨格推定と解析はこの端末の中で行います。</div>

  <section>
    <h2>この端末</h2>
    <table id="env"></table>
  </section>

  <section>
    <h2>1. 動画を選ぶ</h2>
    <div class="row">
      <label><input type="radio" name="mode" value="single" checked> 1動画モード（二人が一緒に映っている）</label>
      <label><input type="radio" name="mode" value="two"> 2動画モード</label>
    </div>
    <div class="row"><span id="labA">動画</span> <input type="file" id="fileA" accept="video/*"></div>
    <div class="row hidden" id="rowB">レビュー対象 <input type="file" id="fileB" accept="video/*"></div>
    <div class="row">
      <label>コマ数 <select id="fps"><option value="30">30 / 秒</option><option value="15">15 / 秒</option></select></label>
      <label>推定 <select id="ep"><option value="webgpu">WebGPU（無ければ WASM）</option><option value="wasm">WASM のみ</option></select></label>
      <label>区間 <input id="maxSec" type="number" min="5" step="5" value="60" style="width:5em"> 秒まで</label>
    </div>
    <button id="run" disabled>骨格推定を始める</button>
    <div id="status" class="sub"></div>
    <progress id="prog" value="0" max="1" class="hidden"></progress>
    <canvas id="preview" class="hidden"></canvas>
  </section>

  <section id="pickSec" class="hidden">
    <h2>2. 人物を選ぶ</h2>
    <div class="sub" id="pickMsg">お手本の人をタップしてください</div>
    <input type="range" id="pickT" min="0" max="1" step="1" value="0" style="width:100%">
    <canvas id="pickCanvas"></canvas>
    <div class="row"><button id="analyze" disabled>解析する</button><button class="ghost" id="repick">選び直す</button></div>
  </section>

  <section id="resSec" class="hidden">
    <h2>3. 結果</h2>
    <div class="scores" id="scores"></div>
    <div id="moments"></div>
    <div id="notes" class="sub"></div>
  </section>

  <section id="perfSec" class="hidden">
    <h2>計測</h2>
    <table id="perf"></table>
    <div class="row">
      <button class="ghost" id="copy">計測結果をコピー</button>
      <button class="ghost" id="dl">骨格データを保存</button>
    </div>
  </section>
  <div id="err" class="err"></div>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
