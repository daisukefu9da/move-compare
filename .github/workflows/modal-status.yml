# サーバー版（Modal）の状態を調べる（手動で実行）: アプリ・コンテナの一覧、最近のログ、サイトの応答時間
name: サーバー版の状態を確認

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      URL: https://daisukefu9da--dance-compare-ui.us-east.modal.run/
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q modal
      - name: アプリとコンテナ
        run: |
          modal app list || true
          modal container list || true
      - name: アプリのエラー出力（12 時間分）
        run: timeout 120 modal app logs dance-compare --since 12h --tail 300 --source stderr --timestamps --show-container-id 2>&1 || true
      - name: アプリの標準出力（12 時間分）
        run: timeout 120 modal app logs dance-compare --since 12h --tail 150 --source stdout --timestamps --show-container-id 2>&1 || true
      - name: Modal のシステムのログ（12 時間分）
        run: timeout 120 modal app logs dance-compare --since 12h --tail 150 --source system --timestamps --show-container-id 2>&1 || true
      - name: サイトの応答時間（起動待ちを含む. 最大 5 分）
        run: |
          for i in 1; do
            curl -s -o /dev/null -m 300 -w "HTTP %{http_code}  接続 %{time_connect}s  最初の応答 %{time_starttransfer}s  合計 %{time_total}s\n" "$URL" || echo "失敗（タイムアウトなど）"
          done
      - name: アップロードの受け口を試す
        run: |
          curl -s -m 60 -X POST --data-binary "test" -w "  HTTP %{http_code}\n" \
            "${URL}api/upload?id=00000000-0000-0000-0000-000000000000&offset=0&final=1&name=check.mp4" || echo "失敗"
      - name: 骨格推定（GPU）を試す（起動 → 短い動画）
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -v error -f lavfi -i testsrc=size=640x360:rate=30 -t 2 -pix_fmt yuv420p /tmp/t.mp4
          python - <<'PY'
          import time, modal
          f = modal.Function.from_name("dance-compare", "track_pose")
          t = time.time(); f.remote(b"", ""); print(f"GPU の起動: {time.time() - t:.1f} 秒")
          data = open("/tmp/t.mp4", "rb").read()
          t = time.time(); out = f.remote(data, ".mp4"); print(f"2 秒の動画の骨格推定: {time.time() - t:.1f} 秒（結果 {len(out)} バイト）")
          PY
      - name: 応答時間を測った後のログ
        run: timeout 120 modal app logs dance-compare --since 10m --tail 200 --timestamps --show-container-id 2>&1 || true
