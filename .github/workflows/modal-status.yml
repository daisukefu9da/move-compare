# サーバー版（Modal）の状態を調べる（手動で実行）: アプリ・コンテナの一覧、最近のログ、サイトの応答時間
name: サーバー版の状態を確認

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      URL: https://daisukefu9da--dance-compare-ui.us-east.modal.run/
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q modal
      - name: アプリとコンテナ
        run: |
          modal app list || true
          modal container list || true
      - name: 最近のログ（6 時間分）
        run: timeout 120 modal app logs dance-compare --since 6h --tail 400 --timestamps --show-container-id 2>&1 || true
      - name: サイトの応答時間（起動待ちを含む. 最大 5 分）
        run: |
          for i in 1 2; do
            curl -s -o /dev/null -m 300 -w "HTTP %{http_code}  接続 %{time_connect}s  最初の応答 %{time_starttransfer}s  合計 %{time_total}s\n" "$URL" || echo "失敗（タイムアウトなど）"
          done
      - name: 応答時間を測った後のログ
        run: timeout 120 modal app logs dance-compare --since 10m --tail 200 --timestamps --show-container-id 2>&1 || true
