# サーバー版（Modal）を再起動する（手動で実行）: アプリを止めて（動いているコンテナもすべて止まる）、公開し直す。
# 画面が固まって応答しなくなったときに使う。
name: サーバー版を再起動

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      URL: https://daisukefu9da--dance-compare-ui.us-east.modal.run/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q modal
      - name: アプリを止める
        run: |
          modal container list || true
          modal app stop dance-compare --yes || modal app stop dance-compare || true
          sleep 5
          modal container list || true
      - name: 公開し直す
        run: modal deploy deploy/modal_app.py
      - name: サイトを開いて起動させる（応答時間）
        run: curl -s -o /dev/null -m 300 -w "HTTP %{http_code}  最初の応答 %{time_starttransfer}s\n" "$URL" || echo "失敗"
      - name: 起動のログ
        run: timeout 60 modal app logs dance-compare --since 10m --tail 80 --timestamps --show-container-id 2>&1 | grep -v "_stcore" || true
