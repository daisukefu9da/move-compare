<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  :root { --fg: #31333f; --sub: #808495; --line: #d6d6d9; --btn: #f0f2f6; --accent: #ff4b4b; --ok: #21a366; }
  html, body { margin: 0; padding: 0; background: transparent; color: var(--fg);
    font-family: "Source Sans Pro", -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 14px; }
  #wrap { padding: 2px 2px 8px; }
  #label { margin-bottom: 6px; }
  .box { border: 1px dashed var(--line); border-radius: 10px; padding: 14px; background: var(--btn); }
  label.pick { display: inline-block; background: var(--accent); color: #fff; border-radius: 8px; padding: 10px 16px;
    cursor: pointer; font-weight: 600; }
  input[type=file] { display: none; }
  #name { margin-top: 8px; word-break: break-all; }
  #status { margin-top: 6px; color: var(--sub); }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--accent); }
  .bar { height: 8px; background: var(--line); border-radius: 4px; margin-top: 8px; overflow: hidden; display: none; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  @media (pointer: coarse) { label.pick { padding: 12px 18px; font-size: 16px; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="label"></div>
  <div class="box">
    <label class="pick">🎥 動画を撮影・選択<input id="file" type="file" accept="video/*"></label>
    <div id="name"></div>
    <video id="pv" muted playsinline webkit-playsinline style="display:none;width:120px;margin-top:8px;border-radius:6px"></video>
    <div class="bar" id="bar"><div id="fill"></div></div>
    <div id="status"></div>
  </div>
</div>
<script type="module">
// 動画を端末の中で軽くしてから（WebCodecs + Mediabunny）、小分けにしてサーバーへ送る。
// 軽くできない端末・動画では、元の動画をそのまま送る。
const $ = (id) => document.getElementById(id);
const S = { args: {}, busy: false };
const send = (type, data) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data || {}), "*");
const setHeight = () => send("streamlit:setFrameHeight", { height: document.documentElement.scrollHeight });
const mb = (n) => (n / 1e6).toFixed(n < 1e7 ? 1 : 0) + " MB";

function status(text, cls = "") { $("status").textContent = text; $("status").className = cls; setHeight(); }
function progress(p) {
  $("bar").style.display = p == null ? "none" : "block";
  $("fill").style.width = `${Math.round((p || 0) * 100)}%`;
  setHeight();
}

// 軽くできなかった理由を残す（サーバーのログに出して、端末ごとの対応に使う）
const diag = [];
const note = (x) => { diag.push(x); console.warn(x); };

async function shrink(file, maxSide, fps, bitrate) {
  if (!("VideoEncoder" in window) || !("VideoDecoder" in window)) { note("WebCodecs なし"); return null; }
  const m = await import("./mediabunny.min.mjs");
  const input = new m.Input({ formats: m.ALL_FORMATS, source: new m.BlobSource(file) });
  const vt = await input.getPrimaryVideoTrack();
  if (!vt) { note("映像なし"); return null; }
  const codecStr = await vt.getCodecParameterString().catch(() => "?");
  note(`元: ${vt.codec} ${codecStr} ${vt.displayWidth}x${vt.displayHeight}`);
  // 前にこの端末で読めなかった形式・大きさなら、試さずにすぐ送る（失敗するまでに数秒かかるため）
  S.failKey = `shrink-fail:${codecStr}:${vt.displayWidth}x${vt.displayHeight}`;
  try { if (localStorage.getItem(S.failKey)) { note("前に読めなかった形式なので省略"); return null; } } catch (e) { /* 使えない環境 */ }
  if (!(await vt.canDecode())) { note("この端末では元の動画を読めない（デコード不可）"); return null; }
  const dw = vt.displayWidth, dh = vt.displayHeight;
  const k = Math.min(1, maxSide / Math.max(dw, dh));
  const even = (x) => Math.max(2, Math.round(x / 2) * 2);
  const w = even(dw * k), h = even(dh * k);
  // H.264 を優先し、使えない端末では使える形式で（サーバー側の ffmpeg / OpenCV はどれも読める）
  const vcodec = await m.getFirstEncodableVideoCodec(["avc", "hevc", "vp9", "av1"], { width: w, height: h });
  if (!vcodec) { note("書き出せる形式なし（エンコード不可）"); return null; }
  const at = await input.getPrimaryAudioTrack();
  const acodec = at && (await at.canDecode().catch(() => false))
    ? await m.getFirstEncodableAudioCodec(["aac", "opus"], { numberOfChannels: at.numberOfChannels, sampleRate: at.sampleRate })
    : null;
  if (at && !acodec) note(`音声は省略（${at.codec}）`);
  const output = new m.Output({ format: new m.Mp4OutputFormat({ fastStart: "in-memory" }), target: new m.BufferTarget() });
  const conv = await m.Conversion.init({
    input, output, showWarnings: false,
    video: { width: w, height: h, fit: "contain", frameRate: fps, codec: vcodec, bitrate },
    audio: acodec ? { codec: acodec, bitrate: 128e3 } : { discard: true },
  });
  if (!conv.isValid) {
    note("変換できない: " + conv.discardedTracks.map((d) => `${d.track.type}:${d.reason}`).join(", "));
    return null;
  }
  conv.onProgress = (p) => { progress(p); status(`動画を軽くしています… ${Math.round(p * 100)}%`); };
  await conv.execute();
  note(`変換: ${vcodec} ${w}x${h}`);
  return new Blob([output.target.buffer], { type: "video/mp4" });
}

// iPhone などで WebCodecs が元の動画を読めない場合（「Decoder failure」等）: ブラウザで動画を再生しながら
// コマを取り出して縮める。再生は 2 倍速（画面の更新 60 回/秒 → 動画 1 秒あたり 30 コマ）で、コマが取りこぼされる
// ほど端末が遅ければ再生を遅くする。音声は変換せずにそのまま写す。
async function shrinkViaVideo(file, maxSide, fps, bitrate) {
  if (!("requestVideoFrameCallback" in HTMLVideoElement.prototype) || !("VideoFrame" in window)) {
    note("再生しながら縮める機能なし"); return null;
  }
  const m = await import("./mediabunny.min.mjs");
  const v = $("pv");
  v.style.display = "block";
  v.muted = true;
  v.src = URL.createObjectURL(file);
  await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(new Error("再生できない動画")); });
  const dw = v.videoWidth, dh = v.videoHeight, dur = v.duration;
  const k = Math.min(1, maxSide / Math.max(dw, dh));
  const even = (x) => Math.max(2, Math.round(x / 2) * 2);
  const w = even(dw * k), h = even(dh * k);
  const vcodec = await m.getFirstEncodableVideoCodec(["avc", "hevc", "vp9", "av1"], { width: w, height: h });
  if (!vcodec) { note("書き出せる形式なし（再生方式）"); return null; }
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  const output = new m.Output({ format: new m.Mp4OutputFormat({ fastStart: "in-memory" }), target: new m.BufferTarget() });
  const vsrc = new m.VideoSampleSource({ codec: vcodec, bitrate });
  output.addVideoTrack(vsrc, { frameRate: fps });
  let at = null, asrc = null;
  try {
    const input = new m.Input({ formats: m.ALL_FORMATS, source: new m.BlobSource(file) });
    at = await input.getPrimaryAudioTrack();
    if (at && at.codec) { asrc = new m.EncodedAudioPacketSource(at.codec); output.addAudioTrack(asrc); }
  } catch (e) { note("音声を読めない（再生方式）"); }
  await output.start();
  if (asrc) {
    const cfg = await at.getDecoderConfig();
    let first = true;
    for await (const p of new m.EncodedPacketSink(at).packets()) {
      await asrc.add(p, first ? { decoderConfig: cfg } : undefined);
      first = false;
    }
  }
  let rate = 2, last = -Infinity, frames = 0, winStart = 0, winFrames = 0, inflight = 0, held = false;
  let queue = Promise.resolve();
  await new Promise((resolve, reject) => {
    v.onended = resolve;
    v.onerror = () => reject(new Error("再生中のエラー"));
    const cb = (now, meta) => {
      const t = meta.mediaTime;
      if (t - last >= 0.9 / fps) {
        ctx.drawImage(v, 0, 0, w, h);
        const sample = new m.VideoSample(new VideoFrame(canvas, { timestamp: Math.round(t * 1e6), duration: Math.round(1e6 / fps) }));
        inflight++;
        queue = queue.then(() => vsrc.add(sample)).finally(() => {
          sample.close();
          inflight--;
          if (held && inflight < 3) { held = false; v.play(); }  // 書き出しが追いついたら再生を続ける
        });
        last = t; frames++; winFrames++;
        if (inflight > 8 && !v.paused) { held = true; v.pause(); }  // 書き出しが追いつかない間は待つ（メモリを使いすぎない）
      }
      if (t - winStart >= 1) {  // 動画 1 秒ごとに、取れたコマが少なければ再生を遅くする
        if (winFrames < fps * 0.8 && rate > 1) { rate = Math.max(1, rate - 0.5); v.playbackRate = rate; }
        else if (winFrames < fps * 0.6 && rate <= 1 && !held) {
          // 等速でもコマが足りない（端末が遅い）: 分析の精度が落ちるので、やめて元の動画を送る
          v.pause();
          return reject(new Error(`コマの取り出しが遅い（動画 1 秒あたり ${winFrames} コマ）`));
        }
        winStart = t; winFrames = 0;
      }
      progress(t / dur);
      status(`動画を軽くしています… ${Math.round((t / dur) * 100)}%`);
      if (!v.ended) v.requestVideoFrameCallback(cb);
    };
    v.requestVideoFrameCallback(cb);
    v.playbackRate = rate;
    v.play().catch(reject);
  });
  await queue;
  await output.finalize();
  v.style.display = "none";
  URL.revokeObjectURL(v.src);
  note(`変換（再生しながら）: ${vcodec} ${w}x${h} ${frames}コマ ${rate}倍速`);
  return new Blob([output.target.buffer], { type: "video/mp4" });
}

// 小分けにして、同時に何本か送る（通信の往復の待ち時間を重ねて速くする）
async function upload(blob, name) {
  const id = crypto.randomUUID();
  const chunk = S.args.chunk_mb * 1024 * 1024;
  const n = Math.max(1, Math.ceil(blob.size / chunk));
  let next = 0, sent = 0;
  async function sendPart(i) {
    const off = i * chunk, end = Math.min(blob.size, off + chunk);
    for (let tries = 0; ; tries++) {
      try {
        const res = await fetch(`${S.args.endpoint}?id=${id}&offset=${off}`, { method: "POST", body: blob.slice(off, end) });
        if (res.ok) break;
        if (res.status < 500 || tries >= 5) throw new Error(`送信に失敗しました（${res.status}）`);
      } catch (e) {
        if (tries >= 5) throw e;  // 電波が途切れた場合などは、少し待ってその部分だけ送り直す
      }
      await new Promise((r) => setTimeout(r, 1000 * (tries + 1)));
    }
    sent += end - off;
    progress(sent / blob.size);
    status(`送信中… ${mb(sent)} / ${mb(blob.size)}`);
  }
  async function worker() {
    while (next < n) await sendPart(next++);
  }
  await Promise.all(Array.from({ length: Math.min(S.args.parallel || 4, n) }, worker));
  const res = await fetch(`${S.args.endpoint}?id=${id}&finalize=1&total=${blob.size}&name=${encodeURIComponent(name)}`,
                          { method: "POST" });
  if (!res.ok) throw new Error(`送信に失敗しました（最後の確認 ${res.status}）`);
  return id;
}

$("file").addEventListener("change", async () => {
  const file = $("file").files[0];
  if (!file || S.busy) return;
  S.busy = true;
  $("name").textContent = `${file.name}（${mb(file.size)}）`;
  const t0 = performance.now();
  let blob = null, shrinkMs = 0;
  diag.length = 0;
  try {
    status("動画を軽くしています…");
    progress(0);
    try {
      blob = S.args.method === "video" ? null : await shrink(file, S.args.max_side, S.args.fps, S.args.bitrate);
    } catch (e) {
      note(`変換中のエラー: ${e && (e.name + ": " + e.message)}`);
      blob = null;
      try { if (S.failKey) localStorage.setItem(S.failKey, "1"); } catch (e2) { /* 使えない環境 */ }
    }
    if (!blob && S.args.method === "video") {  // 再生しながら縮める方式（iPhone では遅く逆効果だったので、確認用のみ）
      try {
        blob = await shrinkViaVideo(file, S.args.max_side, S.args.fps, S.args.bitrate);
      } catch (e) {
        note(`再生方式のエラー: ${e && (e.name + ": " + e.message)}`);
        blob = null;
      }
    }
    shrinkMs = performance.now() - t0;
    // 軽くできなかった・かえって大きくなった場合は元の動画を送る
    const useOriginal = !blob || blob.size >= file.size;
    const body = useOriginal ? file : blob;
    const name = useOriginal ? file.name : file.name.replace(/\.[^.]+$/, "") + ".mp4";
    status(useOriginal ? "送信中…（元の動画のまま送ります）" : `送信中…（${mb(file.size)} → ${mb(blob.size)} に軽くしました）`);
    progress(0);
    const t1 = performance.now();
    const id = await upload(body, name);
    const sendMs = performance.now() - t1;
    progress(null);
    status(useOriginal ? `送信しました（${mb(file.size)}）` : `送信しました（${mb(file.size)} → ${mb(blob.size)}）`, "ok");
    send("streamlit:setComponentValue", {
      dataType: "json",
      value: { id, name, original_size: file.size, size: body.size, shrunk: !useOriginal,
               shrink_s: shrinkMs / 1000, send_s: sendMs / 1000, diag: diag.join(" / "),
               ua: navigator.userAgent },
    });
  } catch (e) {
    progress(null);
    status(`エラー: ${e.message || e}`, "err");
  } finally {
    S.busy = false;
    $("file").value = "";  // 同じ動画をもう一度選んでも反応するように
  }
});

window.addEventListener("message", (ev) => {
  const msg = ev.data;
  if (!msg || msg.type !== "streamlit:render") return;
  S.args = msg.args || {};
  $("label").textContent = S.args.label || "";
  if (msg.theme && msg.theme.base === "dark") {
    const r = document.documentElement.style;
    r.setProperty("--fg", msg.theme.textColor || "#fafafa"); r.setProperty("--btn", "#262730"); r.setProperty("--line", "#4a4c56");
  }
  setHeight();
});
window.addEventListener("resize", setHeight);
send("streamlit:componentReady", { apiVersion: 1 });
</script>
</body>
</html>
