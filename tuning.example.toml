# 解析パラメータの例. `--config tuning.toml` や UI の「設定ファイル」で読み込む.
# 書かなかった項目は既定値（dance_compare/core/config.py）のまま.

# 指摘のしきい値（どれも大きくするほど緩くなり、スコアも上がる）
angle_threshold_deg = 20.0      # 関節角度の差がこれ以上で指摘
timing_threshold_ms = 120.0     # 手本との早い/遅い
rhythm_threshold_ms = 60.0      # 拍とのズレ
amplitude_tolerance = 0.25      # 振れ幅の差の許容（0.25 なら手本の 75% 未満で「小さい」）
sharpness_tolerance = 0.3       # キレが手本より 3 割以上弱ければ指摘
level_threshold = 0.15          # 腰の高さ（各自の普段の高さからの沈み込み）の差. 胴の長さ比

# スコア: しきい値のこの割合以下のズレは減点しない（しきい値ちょうどで 80 点, 2 倍で 50 点）
score_full_ratio = 0.5

# 評価の区切り（カウント数）
window_counts = 2

# 動きのアクセント: "peak"（速度のピーク）/ "hit"（急停止）
accent_mode = "peak"
beat_subdivision = 2            # 裏拍(&)も拍として扱う

# 時間合わせ
dtw_band_s = 3.0                # テンポのズレの許容 [秒]
dtw_open_ends = false
